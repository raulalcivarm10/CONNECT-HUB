name: connect-hub

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-connecthub.fourstacklabs.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@fourstacklabs.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      target: prod
    expose:
      - "4000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      COOKIE_SECURE: "true"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_NAS_URL: ${NEXT_PUBLIC_NAS_URL:-https://api-ligaprocorp.ec:3443/api}
    expose:
      - "3000"
    environment:
      NODE_ENV: production
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
  caddy_data:
  caddy_config:
